<!doctype html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layouts/admin/admin-layout}"
>
<head>
    <title>Admin Dashboard</title>
</head>
<body>
<div layout:fragment="content">
    <div class="flex flex-col gap-6">
            <!-- Header Section -->
            <div class="flex flex-col gap-2 md:flex-row md:items-end md:justify-between">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Quản lý quyên góp</h1>
                    <p class="text-slate-500 dark:text-slate-400 mt-1">Theo dõi, kiểm tra và phê duyệt các khoản đóng
                        góp từ nhà hảo tâm.</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button id="donationExportBtn"
                            type="button"
                            class="flex items-center gap-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-2 rounded-lg text-sm font-medium shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                        <span class="material-symbols-outlined text-[18px]">file_download</span>
                        Xuất Excel
                    </button>
                    <input id="donationImportInput" type="file" class="hidden" accept=".xlsx,.xls"/>
                    <button id="donationImportBtn"
                            type="button"
                            sec:authorize="hasAnyRole('ADMIN', 'STAFF')"
                            class="flex items-center gap-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-2 rounded-lg text-sm font-medium shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                        <span class="material-symbols-outlined text-[18px]">upload_file</span>
                        Nhập Excel
                    </button>
                    <a th:href="@{/admin/donations/form}"
                       sec:authorize="hasAnyRole('ADMIN', 'STAFF')"
                       class="flex items-center gap-2 bg-primary text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm hover:bg-primary/90 transition-colors">
                        <span class="material-symbols-outlined text-[18px]">add</span>
                        Tạo mới quyên góp
                    </a>
                </div>
            </div>
            <!-- Filters & Search -->
            <div class="bg-surface-light dark:bg-surface-dark rounded-xl border border-border-light dark:border-border-dark shadow-sm p-4">
                <div class="flex flex-col lg:flex-row gap-4">
                    <!-- Search -->
                    <div class="flex-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-slate-400">search</span>
                        </div>
                        <input id="donationSearchInput"
                               class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm"
                               placeholder="Tìm theo mã đơn (DNT-...) hoặc tên nhà hảo tâm..." type="text"/>
                    </div>
                    <!-- Filters Group -->
                    <div class="flex flex-col sm:flex-row gap-4">
                        <select id="donationStatusFilter"
                                class="block w-full sm:w-48 pl-3 pr-10 py-2.5 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent cursor-pointer">
                            <option value="">Tất cả trạng thái</option>
                            <option value="PENDING_APPROVED">Chờ duyệt</option>
                            <option value="PENDING_PAYMENT">Chờ thanh toán</option>
                            <option value="CONFIRMED">Đã xác nhận</option>
                            <option value="REJECTED">Đã từ chối</option>
                            <option value="FAILED">Thất bại</option>
                        </select>
                        <select id="donationTargetFilter"
                                class="block w-full sm:w-48 pl-3 pr-10 py-2.5 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent cursor-pointer">
                            <option value="">Tất cả mục tiêu</option>
                            <option value="EVENT">Sự kiện từ thiện</option>
                            <option value="ACTIVITY">Hoạt động thường niên</option>
                            <option value="NONE">Không gắn mục tiêu</option>
                        </select>
                        <select id="donationPaymentMethodFilter"
                                class="block w-full sm:w-48 pl-3 pr-10 py-2.5 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent cursor-pointer">
                            <option value="">Tất cả phương thức</option>
                            <option value="BANK_TRANSFER_ONLINE">Chuyển khoản online</option>
                            <option value="BANK_TRANSFER_OFFLINE">Chuyển khoản thủ công</option>
                            <option value="CASH">Tiền mặt</option>
                        </select>
                        <button id="donationAmountRangeToggle"
                                type="button"
                                class="flex items-center justify-center gap-2 px-4 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors bg-white dark:bg-slate-800 text-sm font-medium">
                            <span class="material-symbols-outlined text-[18px]">tune</span>
                            Lọc số tiền
                        </button>
                        <button id="donationResetFilterBtn"
                                class="flex items-center justify-center px-4 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors bg-white dark:bg-slate-800"
                                title="Reset Filters">
                            <span class="material-symbols-outlined text-[20px]">restart_alt</span>
                        </button>
                    </div>
                </div>
                <div id="donationAmountRangePanel"
                     class="mt-4 hidden rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/60 p-4">
                    <div class="flex flex-col gap-4 md:flex-row md:items-end">
                        <div class="w-full md:w-56">
                            <label for="donationMinAmountFilter"
                                   class="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-300">
                                Số tiền từ
                            </label>
                            <input id="donationMinAmountFilter"
                                   type="number"
                                   min="0"
                                   step="1"
                                   inputmode="numeric"
                                   placeholder="Ví dụ: 100000"
                                   class="block w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2.5 text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                        </div>
                        <div class="w-full md:w-56">
                            <label for="donationMaxAmountFilter"
                                   class="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-300">
                                Đến
                            </label>
                            <input id="donationMaxAmountFilter"
                                   type="number"
                                   min="0"
                                   step="1"
                                   inputmode="numeric"
                                   placeholder="Ví dụ: 1000000"
                                   class="block w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2.5 text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                        </div>
                        <div class="flex gap-3">
                            <button id="donationApplyAmountFilterBtn"
                                    type="button"
                                    class="inline-flex items-center justify-center rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white hover:bg-primary/90 transition-colors">
                                Áp dụng
                            </button>
                            <button id="donationClearAmountFilterBtn"
                                    type="button"
                                    class="inline-flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                                Xóa khoảng tiền
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Donation List -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="min-w-full divide-y divide-slate-200">
                        <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider"
                                scope="col">Mã đơn
                            </th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider"
                                scope="col">Nhà hảo tâm
                            </th>
                            <th class="px-6 py-4 text-right text-xs font-semibold text-slate-600 uppercase tracking-wider"
                                scope="col">Số tiền
                            </th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider"
                                scope="col">Mục tiêu
                            </th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider hidden xl:table-cell"
                                scope="col">Phương thức
                            </th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider"
                                scope="col">Trạng thái
                            </th>
                        </tr>
                        </thead>
                        <tbody id="donationTableBody"
                               class="bg-white divide-y divide-slate-200"></tbody>
                    </table>
                </div>
                <!-- Pagination -->
                <div id="paginationContainer"></div>
            </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        window.__CAN_APPROVE_DONATIONS__ = false;
        window.__CAN_MANAGE_DONATIONS__ = false;
    </script>
    <script th:inline="javascript" sec:authorize="hasAnyRole('ADMIN', 'ACCOUNTING')">
        window.__CAN_APPROVE_DONATIONS__ = true;
    </script>
    <script th:inline="javascript" sec:authorize="hasAnyRole('ADMIN', 'STAFF')">
        window.__CAN_MANAGE_DONATIONS__ = true;
    </script>
    <script type="module" th:src="@{/js/pages/admin/donationList.js}"></script>
</th:block>
</body>
</html>

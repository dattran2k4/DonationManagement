<!doctype html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layouts/admin/admin-layout}"
>
<head>
    <title>Quản lý nhà hảo tâm</title>
</head>
<body>
<div layout:fragment="content" class="admin-page-stack">
    <section class="admin-page-heading">
        <div>
            <h1 class="admin-page-title">Quản lý Nhà hảo tâm</h1>
            <p class="admin-page-subtitle">Theo dõi hồ sơ, lịch sử đóng góp và các mối quan hệ liên quan trong cùng một bố cục nhẹ, sạch và dễ rà soát.</p>
        </div>
        <div class="admin-toolbar-group">
            <button id="donorExportBtn"
                    type="button"
                    class="admin-action-btn admin-action-btn--ghost">
                <span class="material-symbols-outlined text-[18px]">file_download</span>
                <span>Xuất Excel</span>
            </button>
            <input id="donorImportInput" type="file" class="hidden" accept=".xlsx,.xls"/>
            <button id="donorImportBtn"
                    type="button"
                    sec:authorize="hasAnyRole('ADMIN', 'STAFF')"
                    class="admin-action-btn admin-action-btn--ghost">
                <span class="material-symbols-outlined text-[18px]">upload_file</span>
                <span>Nhập Excel</span>
            </button>
            <a th:href="@{/admin/donors/form}"
               sec:authorize="hasAnyRole('ADMIN', 'STAFF')"
               class="admin-action-btn admin-action-btn--primary">
                <span class="material-symbols-outlined text-[18px]">add</span>
                <span>Thêm Nhà hảo tâm</span>
            </a>
        </div>
    </section>

    <section class="admin-filter-shell">
        <div class="flex flex-col xl:flex-row gap-4">
            <div class="relative flex-1">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-slate-400">search</span>
                </div>
                <input id="donorSearchInput"
                       class="admin-search-input block w-full pl-12 pr-4 py-3.5 text-sm placeholder:text-slate-400"
                       placeholder="Họ tên, số điện thoại, email..." type="text"/>
            </div>
            <div class="flex gap-3">
                <div class="relative min-w-[180px]">
                    <select id="donorTypeFilter"
                            class="admin-select-field w-full appearance-none pl-4 pr-10 py-3 text-sm cursor-pointer">
                        <option value="">Loại: Tất cả</option>
                        <option value="INDIVIDUAL">Cá nhân</option>
                        <option value="ORGANIZATION">Tổ chức</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                        <span class="material-symbols-outlined text-sm">expand_more</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="admin-table-shell">
        <div class="overflow-x-auto custom-scrollbar">
            <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-800">
                <thead>
                <tr>
                    <th class="px-6 py-4 text-left" scope="col">
                        <button type="button"
                                data-donor-sort="name"
                                class="inline-flex items-center gap-1.5 bg-transparent border-0 p-0 font-sans text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 hover:text-primary transition-colors">
                            <span>Tên nhà hảo tâm</span>
                            <span data-sort-icon class="material-symbols-outlined text-[16px] leading-none">unfold_more</span>
                        </button>
                    </th>
                    <th class="px-6 py-4 text-left" scope="col">
                        <button type="button"
                                data-donor-sort="type"
                                class="inline-flex items-center gap-1.5 bg-transparent border-0 p-0 font-sans text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 hover:text-primary transition-colors">
                            <span>Loại</span>
                            <span data-sort-icon class="material-symbols-outlined text-[16px] leading-none">unfold_more</span>
                        </button>
                    </th>
                    <th class="px-6 py-4 text-left" scope="col">
                        <button type="button"
                                data-donor-sort="contact"
                                class="inline-flex items-center gap-1.5 bg-transparent border-0 p-0 font-sans text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 hover:text-primary transition-colors">
                            <span>Thông tin liên hệ</span>
                            <span data-sort-icon class="material-symbols-outlined text-[16px] leading-none">unfold_more</span>
                        </button>
                    </th>
                    <th class="px-6 py-4 text-left" scope="col">
                        <button type="button"
                                data-donor-sort="createdAt"
                                class="inline-flex items-center gap-1.5 bg-transparent border-0 p-0 font-sans text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 hover:text-primary transition-colors">
                            <span>Ngày tham gia</span>
                            <span data-sort-icon class="material-symbols-outlined text-[16px] leading-none">unfold_more</span>
                        </button>
                    </th>
                    <th class="px-6 py-4 text-center" scope="col">
                        <button type="button"
                                data-donor-sort="numberOfDonations"
                                class="inline-flex items-center justify-center gap-1.5 bg-transparent border-0 p-0 font-sans text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 hover:text-primary transition-colors">
                            <span>Số lần đóng góp</span>
                            <span data-sort-icon class="material-symbols-outlined text-[16px] leading-none">unfold_more</span>
                        </button>
                    </th>
                    <th class="px-6 py-4 text-right" scope="col">
                        <button type="button"
                                data-donor-sort="totalDonationAmount"
                                class="inline-flex items-center justify-end gap-1.5 bg-transparent border-0 p-0 font-sans text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 hover:text-primary transition-colors">
                            <span>Tổng tiền</span>
                            <span data-sort-icon class="material-symbols-outlined text-[16px] leading-none">unfold_more</span>
                        </button>
                    </th>
                    <th class="px-6 py-4 text-center sticky right-0 bg-slate-50 dark:bg-slate-900" scope="col">
                        Hành động
                    </th>
                </tr>
                </thead>
                <tbody id="donorTableBody"
                       class="divide-y divide-slate-200 dark:divide-slate-800">
                </tbody>
            </table>
        </div>
        <div id="paginationContainer"></div>
    </section>
</div>
<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        window.__CAN_MANAGE_DONORS__ = false;
    </script>
    <script th:inline="javascript" sec:authorize="hasAnyRole('ADMIN', 'STAFF')">
        window.__CAN_MANAGE_DONORS__ = true;
    </script>
    <script type="module" th:src="@{/js/pages/admin/donorList.js}"></script>
</th:block>
</body>
</html>

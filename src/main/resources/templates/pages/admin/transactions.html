<!doctype html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layouts/admin/admin-layout}"
>
<head>
    <title>Lịch sử giao dịch</title>
</head>
<body>
<div layout:fragment="content">
    <!-- Header Section -->
    <header class="px-0 py-1">
        <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Lịch sử giao dịch</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Theo dõi lịch sử giao dịch và đối soát với các đơn
                    quyên góp.</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button id="transactionExportBtn"
                        type="button"
                        class="flex items-center gap-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-2 rounded-lg text-sm font-medium shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                    <span class="material-symbols-outlined text-[18px]">file_download</span>
                    Xuất Excel
                </button>
                <input id="transactionImportInput" type="file" class="hidden" accept=".xlsx,.xls"/>
                <button id="transactionImportBtn"
                        type="button"
                        sec:authorize="hasAnyRole('ADMIN', 'ACCOUNTING')"
                        class="flex items-center gap-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-2 rounded-lg text-sm font-medium shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                    <span class="material-symbols-outlined text-[18px]">upload_file</span>
                    Nhập Excel
                </button>
            </div>
        </div>
    </header>
    <div class="flex flex-col gap-6">
        <!-- Filters and Search -->
        <div class="flex flex-col lg:flex-row justify-between gap-4 items-start lg:items-center bg-surface-light dark:bg-surface-dark p-4 rounded-xl border border-border-light dark:border-border-dark shadow-sm">
            <!-- Search -->
            <div class="relative w-full lg:w-96 group">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-slate-400 group-focus-within:text-emerald-500 transition-colors">search</span>
                </div>
                <input id="transactionSearchInput"
                       class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 dark:border-slate-600 rounded-lg leading-5 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all sm:text-sm"
                       placeholder="Tìm mã giao dịch hoặc tên tài khoản..." type="text"/>
            </div>
            <!-- Filters -->
            <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                <div class="relative">
                    <select id="transactionMethodFilter"
                            class="appearance-none bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-300 py-2.5 pl-3 pr-10 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 text-sm cursor-pointer">
                        <option value="">Tất cả phương thức</option>
                        <option value="BANK_TRANSFER_ONLINE">Chuyển khoản online</option>
                        <option value="BANK_TRANSFER_OFFLINE">Chuyển khoản thủ công</option>
                        <option value="CASH">Tiền mặt</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                        <span class="material-symbols-outlined text-sm">expand_more</span>
                    </div>
                </div>
                <button id="transactionResetFilterBtn"
                        class="p-2.5 text-emerald-600 bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-900/30 dark:text-emerald-400 dark:hover:bg-emerald-900/50 rounded-lg transition-colors ml-auto lg:ml-0 border border-emerald-200 dark:border-emerald-800/50"
                        title="Đặt lại bộ lọc">
                    <span class="material-symbols-outlined">restart_alt</span>
                </button>
            </div>
        </div>
        <!-- Transaction List -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="bg-slate-50 border-b border-slate-200">
                        <th class="p-4 text-xs font-semibold text-slate-600 uppercase tracking-wider whitespace-nowrap">
                            Mã giao dịch
                        </th>
                        <th class="p-4 text-xs font-semibold text-slate-600 uppercase tracking-wider whitespace-nowrap text-right">
                            Số tiền
                        </th>
                        <th class="p-4 text-xs font-semibold text-slate-600 uppercase tracking-wider whitespace-nowrap">
                            Tài khoản gửi
                        </th>
                        <th class="p-4 text-xs font-semibold text-slate-600 uppercase tracking-wider whitespace-nowrap">
                            Đơn quyên góp
                        </th>
                        <th class="p-4 text-xs font-semibold text-slate-600 uppercase tracking-wider whitespace-nowrap">
                            Phương thức
                        </th>
                        <th class="p-4 text-xs font-semibold text-slate-600 uppercase tracking-wider whitespace-nowrap">
                            Thời gian tạo
                        </th>
                    </tr>
                    </thead>
                    <tbody id="transactionTableBody" class="bg-white divide-y divide-slate-200">
                    </tbody>
                </table>
            </div>
            <!-- Pagination -->
            <div id="paginationContainer"></div>
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script type="module" th:src="@{/js/pages/admin/transactionList.js}"></script>
</th:block>
</body>
</html>

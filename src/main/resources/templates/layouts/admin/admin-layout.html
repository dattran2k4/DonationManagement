<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE"></title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/themes/lark.css"/>
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <style>
        .admin-theme {
            --admin-primary: #389663;
            --admin-primary-soft: rgba(56, 150, 99, 0.1);
            --admin-primary-border: rgba(56, 150, 99, 0.2);
            --admin-text-primary-light: #18263f;
            --admin-text-secondary-light: #6d7a90;
            --admin-text-primary-dark: #f8fafc;
            --admin-text-secondary-dark: #a7b6cb;
            --admin-border-light: #dce6df;
            --admin-border-dark: #334155;
            --admin-surface-light: #ffffff;
            --admin-surface-soft-light: #f3f7f4;
            --admin-surface-dark: #0f172a;
            --admin-surface-dark-soft: #172133;
            --admin-surface-dark-soft-strong: rgba(23, 33, 51, 0.94);
            --admin-background-light: #f4faf4;
            --admin-background-dark: #08111c;
            --admin-shadow-light: 0 18px 38px rgba(23, 37, 24, 0.08);
            --admin-shadow-soft: 0 8px 20px rgba(23, 37, 24, 0.06);
        }

        .admin-theme body,
        .admin-theme {
            font-family: "Inter", sans-serif;
        }

        .admin-theme .bg-surface,
        .admin-theme .bg-white:not([class*="dark:bg-"]) {
            background-color: var(--admin-surface-light);
        }

        .admin-theme .bg-slate-50:not([class*="dark:bg-"]),
        .admin-theme .bg-slate-100:not([class*="dark:bg-"]),
        .admin-theme .bg-surface-soft {
            background-color: var(--admin-surface-soft-light);
        }

        .admin-theme .text-text-main,
        .admin-theme .text-text-primary-light {
            color: var(--admin-text-primary-light);
        }

        .admin-theme .text-text-secondary,
        .admin-theme .text-text-secondary-light {
            color: var(--admin-text-secondary-light);
        }

        .admin-theme .text-text-primary-dark {
            color: var(--admin-text-primary-dark);
        }

        .admin-theme .text-text-secondary-dark {
            color: var(--admin-text-secondary-dark);
        }

        .admin-theme .border-border-light {
            border-color: var(--admin-border-light);
        }

        .admin-theme .border-border-dark {
            border-color: var(--admin-border-dark);
        }

        .admin-theme .bg-primary {
            color: #ffffff;
        }

        .admin-theme .bg-primary .material-symbols-outlined,
        .admin-theme .bg-primary .material-icons {
            color: currentColor;
        }

        .admin-theme .admin-shell-main {
            background:
                radial-gradient(circle at top right, rgba(56, 150, 99, 0.08), transparent 22%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.55)),
                var(--admin-background-light);
        }

        .admin-theme .admin-page-stack {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .admin-theme .admin-page-heading {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
        }

        .admin-theme .admin-page-title {
            font-size: 2rem;
            line-height: 1.1;
            font-weight: 800;
            color: var(--admin-text-primary-light);
            letter-spacing: -0.03em;
        }

        .admin-theme .admin-page-subtitle {
            margin-top: 0.35rem;
            font-size: 0.95rem;
            color: var(--admin-text-secondary-light);
        }

        .admin-theme .admin-surface-card {
            border: 1px solid var(--admin-border-light);
            background: var(--admin-surface-light);
            border-radius: 1.6rem;
            box-shadow: var(--admin-shadow-light);
        }

        .admin-theme .admin-surface-card--soft {
            border: 1px solid rgba(220, 230, 223, 0.85);
            background: rgba(255, 255, 255, 0.94);
            border-radius: 1.45rem;
            box-shadow: var(--admin-shadow-soft);
        }

        .admin-theme .admin-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.85rem;
            padding: 1rem 1.2rem;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--admin-border-light);
            background: rgba(255, 255, 255, 0.96);
            border-radius: 1.35rem;
            box-shadow: var(--admin-shadow-soft);
        }

        .admin-theme .admin-toolbar-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.85rem;
        }

        .admin-theme .admin-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            min-height: 2.85rem;
            padding: 0.75rem 1.15rem;
            border-radius: 1rem;
            border: 1px solid var(--admin-border-light);
            background: #eef2f0;
            color: var(--admin-text-primary-light);
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1;
            transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease, border-color .18s ease, color .18s ease;
        }

        .admin-theme .admin-action-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--admin-shadow-soft);
        }

        .admin-theme .admin-action-btn--primary {
            border-color: transparent;
            background: var(--admin-primary);
            color: #ffffff;
            box-shadow: 0 14px 28px rgba(56, 150, 99, 0.18);
        }

        .admin-theme .admin-action-btn--danger {
            border-color: transparent;
            background: #ef5350;
            color: #ffffff;
            box-shadow: 0 14px 28px rgba(239, 83, 80, 0.18);
        }

        .admin-theme .admin-action-btn--ghost {
            background: #ffffff;
        }

        .admin-theme .admin-action-btn:disabled {
            opacity: 0.55;
            pointer-events: none;
            box-shadow: none;
        }

        .admin-theme .admin-stat-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1rem;
        }

        .admin-theme .admin-stat-card {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1.15rem 1.3rem;
            border: 1px solid var(--admin-border-light);
            border-radius: 1.45rem;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: var(--admin-shadow-soft);
        }

        .admin-theme .admin-stat-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3rem;
            height: 3rem;
            border-radius: 1rem;
            background: rgba(56, 150, 99, 0.1);
            color: var(--admin-primary);
        }

        .admin-theme .admin-filter-shell {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1rem 1.2rem;
            border: 1px solid var(--admin-border-light);
            background: rgba(255, 255, 255, 0.94);
            border-radius: 1.45rem;
            box-shadow: var(--admin-shadow-soft);
        }

        .admin-theme .admin-search-input,
        .admin-theme .admin-select-field,
        .admin-theme .admin-input-field,
        .admin-theme .admin-textarea-field {
            border: 1px solid var(--admin-border-light);
            background: #f3f6f3;
            color: var(--admin-text-primary-light);
            border-radius: 1rem;
            min-height: 3rem;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .admin-theme .admin-textarea-field {
            min-height: 7rem;
        }

        .admin-theme .admin-search-input:focus,
        .admin-theme .admin-select-field:focus,
        .admin-theme .admin-input-field:focus,
        .admin-theme .admin-textarea-field:focus {
            border-color: rgba(56, 150, 99, 0.45);
            box-shadow: 0 0 0 4px rgba(56, 150, 99, 0.12);
            outline: none;
        }

        .admin-theme .admin-table-shell {
            overflow: hidden;
            border: 1px solid var(--admin-border-light);
            background: rgba(255, 255, 255, 0.98);
            border-radius: 1.55rem;
            box-shadow: var(--admin-shadow-light);
        }

        .admin-theme .admin-table-shell table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .admin-theme .admin-table-shell thead tr {
            background: #f7faf7;
        }

        .admin-theme .admin-table-shell th {
            color: #6a788e;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .admin-theme .admin-table-shell td {
            color: var(--admin-text-primary-light);
            vertical-align: middle;
        }

        .admin-theme .admin-table-shell tbody tr {
            transition: background-color .18s ease;
        }

        .admin-theme .admin-table-shell tbody tr:hover {
            background: rgba(56, 150, 99, 0.06);
        }

        .admin-theme .admin-detail-frame {
            border: 1px solid var(--admin-border-light);
            background: rgba(255, 255, 255, 0.97);
            border-radius: 1.65rem;
            box-shadow: var(--admin-shadow-light);
            overflow: hidden;
        }

        .admin-theme .admin-detail-header {
            padding: 1.7rem 1.8rem 1rem;
            border-bottom: 1px solid var(--admin-border-light);
        }

        .admin-theme .admin-detail-title {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.08;
            color: var(--admin-text-primary-light);
            letter-spacing: -0.035em;
        }

        .admin-theme .admin-detail-subtitle {
            color: var(--admin-text-secondary-light);
            font-size: 1rem;
        }

        .admin-theme .admin-tab-strip {
            display: flex;
            gap: 2rem;
            overflow-x: auto;
            white-space: nowrap;
        }

        .admin-theme .admin-tab-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0 0 1rem;
            border: none;
            border-bottom: 3px solid transparent;
            background: transparent;
            color: #7a8699;
            font-size: 1rem;
            font-weight: 600;
            transition: color .18s ease, border-color .18s ease;
        }

        .admin-theme .admin-tab-link:hover {
            color: var(--admin-text-primary-light);
        }

        .admin-theme .admin-tab-link.is-active {
            border-bottom-color: var(--admin-primary);
            color: var(--admin-primary);
        }

        .admin-theme .admin-field-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.25rem;
        }

        .admin-theme .admin-info-card {
            border: 1px solid var(--admin-border-light);
            border-radius: 1.45rem;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: var(--admin-shadow-soft);
            padding: 1.35rem;
        }

        .admin-theme .admin-info-card__title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--admin-text-primary-light);
            margin-bottom: 1rem;
        }

        .admin-theme .admin-form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--admin-text-primary-light);
        }

        .admin-theme .admin-muted-label {
            font-size: 0.85rem;
            color: var(--admin-text-secondary-light);
            font-weight: 600;
        }

        .admin-theme .admin-field-value {
            min-height: 3rem;
            display: flex;
            align-items: center;
            padding: 0.8rem 1rem;
            background: #f3f6f3;
            border: 1px solid #e2e8e5;
            border-radius: 0.95rem;
            color: var(--admin-text-primary-light);
            font-weight: 600;
        }

        .admin-theme .admin-upload-box {
            min-height: 12rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 0.35rem;
            border: 1.5px dashed #c7d7cb;
            background: #f3f6f3;
            border-radius: 1.15rem;
            color: var(--admin-text-secondary-light);
            transition: border-color .18s ease, background-color .18s ease;
        }

        .admin-theme .admin-upload-box:hover {
            border-color: rgba(56, 150, 99, 0.35);
            background: rgba(56, 150, 99, 0.06);
        }

        .admin-theme .admin-sidebar {
            background: rgba(255, 255, 255, 0.97);
            border-right: 1px solid var(--admin-border-light);
            box-shadow: 8px 0 24px rgba(23, 37, 24, 0.03);
        }

        .admin-theme .admin-brand-card {
            padding: 1.25rem 1.1rem 0.75rem;
        }

        .admin-theme .admin-brand-pill {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            padding: 0.85rem 0.95rem;
            border: 1px solid var(--admin-border-light);
            border-radius: 1.3rem;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: var(--admin-shadow-soft);
        }

        .admin-theme .admin-nav-link {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.88rem 1rem;
            border-radius: 1rem;
            color: #708097;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color .18s ease, color .18s ease, transform .18s ease;
        }

        .admin-theme .admin-nav-link:hover {
            background: #eef5ef;
            color: var(--admin-text-primary-light);
            transform: translateX(2px);
        }

        .admin-theme .admin-nav-link.is-active {
            background: rgba(56, 150, 99, 0.12);
            color: var(--admin-primary);
            box-shadow: inset 0 0 0 1px rgba(56, 150, 99, 0.16);
        }

        .admin-theme .admin-nav-link.is-active .material-symbols-outlined,
        .admin-theme .admin-nav-link.is-active .material-icons {
            color: var(--admin-primary);
        }

        .admin-theme .admin-profile-card {
            border-top: 1px solid rgba(220, 230, 223, 0.9);
            padding: 1rem;
        }

        .admin-theme .admin-profile-inner {
            padding: 0.8rem 0.9rem;
            border: 1px solid var(--admin-border-light);
            border-radius: 1.2rem;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: var(--admin-shadow-soft);
        }

        .admin-theme .admin-scrollbar::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        .admin-theme .admin-scrollbar::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: rgba(109, 122, 144, 0.32);
        }

        .admin-theme .custom-scrollbar::-webkit-scrollbar {
            height: 10px;
        }

        .admin-theme .custom-scrollbar::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: rgba(109, 122, 144, 0.28);
        }

        @media (max-width: 1279px) {
            .admin-theme .admin-stat-grid,
            .admin-theme .admin-field-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 767px) {
            .admin-theme .admin-page-title,
            .admin-theme .admin-detail-title {
                font-size: 1.75rem;
            }

            .admin-theme .admin-toolbar {
                padding: 0.9rem;
            }

            .admin-theme .admin-action-btn {
                width: 100%;
            }
        }

        @media (prefers-color-scheme: dark) {
            .admin-theme .admin-shell-main {
                background:
                    radial-gradient(circle at top right, rgba(56, 150, 99, 0.16), transparent 24%),
                    linear-gradient(180deg, rgba(8, 17, 28, 0.96), rgba(8, 17, 28, 0.96)),
                    var(--admin-background-dark);
            }

            .admin-theme .admin-sidebar,
            .admin-theme .bg-surface,
            .admin-theme .dark\:bg-surface-dark,
            .admin-theme .bg-white:not([class*="dark:bg-"]) {
                background-color: var(--admin-surface-dark);
            }

            .admin-theme .bg-slate-50:not([class*="dark:bg-"]),
            .admin-theme .bg-slate-100:not([class*="dark:bg-"]),
            .admin-theme .dark\:bg-slate-800,
            .admin-theme .bg-surface-soft {
                background-color: var(--admin-surface-dark-soft);
            }

            .admin-theme .bg-slate-50\/50:not([class*="dark:bg-"]),
            .admin-theme .bg-slate-50\/95:not([class*="dark:bg-"]),
            .admin-theme .dark\:bg-slate-800\/30,
            .admin-theme .dark\:bg-slate-800\/50,
            .admin-theme .dark\:bg-slate-900\/50,
            .admin-theme .dark\:bg-slate-900\/90 {
                background-color: var(--admin-surface-dark-soft-strong);
            }

            .admin-theme .dark\:bg-slate-900 {
                background-color: var(--admin-surface-dark);
            }

            .admin-theme .text-slate-900,
            .admin-theme .text-slate-800,
            .admin-theme .text-text-main,
            .admin-theme .text-text-primary-light,
            .admin-theme .text-text-primary-dark,
            .admin-theme .admin-page-title,
            .admin-theme .admin-detail-title,
            .admin-theme .admin-form-label,
            .admin-theme .admin-info-card__title,
            .admin-theme .admin-field-value {
                color: var(--admin-text-primary-dark);
            }

            .admin-theme .text-slate-700,
            .admin-theme .text-slate-600,
            .admin-theme .text-slate-500,
            .admin-theme .text-slate-400,
            .admin-theme .text-text-secondary,
            .admin-theme .text-text-secondary-light,
            .admin-theme .text-text-secondary-dark,
            .admin-theme .admin-page-subtitle,
            .admin-theme .admin-detail-subtitle,
            .admin-theme .admin-muted-label,
            .admin-theme .admin-nav-link {
                color: var(--admin-text-secondary-dark);
            }

            .admin-theme .border-slate-100,
            .admin-theme .border-slate-200,
            .admin-theme .border-border-light,
            .admin-theme .border-border-dark,
            .admin-theme .dark\:border-slate-600,
            .admin-theme .dark\:border-slate-700,
            .admin-theme .dark\:border-slate-800,
            .admin-theme .admin-sidebar,
            .admin-theme .admin-surface-card,
            .admin-theme .admin-surface-card--soft,
            .admin-theme .admin-toolbar,
            .admin-theme .admin-filter-shell,
            .admin-theme .admin-table-shell,
            .admin-theme .admin-detail-frame,
            .admin-theme .admin-info-card,
            .admin-theme .admin-profile-inner {
                border-color: var(--admin-border-dark);
            }

            .admin-theme .divide-slate-200 > :not([hidden]) ~ :not([hidden]) {
                border-color: var(--admin-border-dark);
            }

            .admin-theme .admin-surface-card,
            .admin-theme .admin-surface-card--soft,
            .admin-theme .admin-toolbar,
            .admin-theme .admin-filter-shell,
            .admin-theme .admin-table-shell,
            .admin-theme .admin-detail-frame,
            .admin-theme .admin-info-card,
            .admin-theme .admin-brand-pill,
            .admin-theme .admin-profile-inner {
                background: rgba(15, 23, 42, 0.96);
                box-shadow: none;
            }

            .admin-theme .admin-stat-card,
            .admin-theme .admin-brand-pill {
                border-color: var(--admin-border-dark);
                background: rgba(15, 23, 42, 0.95);
                box-shadow: none;
            }

            .admin-theme .admin-search-input,
            .admin-theme .admin-select-field,
            .admin-theme .admin-input-field,
            .admin-theme .admin-textarea-field,
            .admin-theme .admin-field-value,
            .admin-theme .admin-upload-box {
                border-color: rgba(148, 163, 184, 0.18);
                background: rgba(15, 23, 42, 0.8);
                color: var(--admin-text-primary-dark);
                box-shadow: none;
            }

            .admin-theme .admin-nav-link:hover {
                background: rgba(56, 150, 99, 0.1);
                color: var(--admin-text-primary-dark);
            }

            .admin-theme .admin-nav-link.is-active {
                background: rgba(56, 150, 99, 0.18);
            }
        }
    </style>

    <!-- Favicon   -->
    <link rel="apple-touch-icon" sizes="57x57" th:href="@{/favicon/apple-icon-57x57.png}">
    <link rel="apple-touch-icon" sizes="60x60" th:href="@{/favicon/apple-icon-60x60.png}">
    <link rel="apple-touch-icon" sizes="72x72" th:href="@{/favicon/apple-icon-72x72.png}">
    <link rel="apple-touch-icon" sizes="76x76" th:href="@{/favicon/apple-icon-76x76.png}">
    <link rel="apple-touch-icon" sizes="114x114" th:href="@{/favicon/apple-icon-114x114.png}">
    <link rel="apple-touch-icon" sizes="120x120" th:href="@{/favicon/apple-icon-120x120.png}">
    <link rel="apple-touch-icon" sizes="144x144" th:href="@{/favicon/apple-icon-144x144.png}">
    <link rel="apple-touch-icon" sizes="152x152" th:href="@{/favicon/apple-icon-152x152.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/favicon/apple-icon-180x180.png}">

    <link rel="icon" type="image/png" sizes="192x192" th:href="@{/favicon/android-icon-192x192.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="96x96" th:href="@{/favicon/favicon-96x96.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon/favicon-16x16.png}">

    <link rel="manifest" th:href="@{/favicon/manifest.json}">
    <meta name="msapplication-TileColor" content="#389663">
    <meta name="msapplication-TileImage" th:content="@{/favicon/ms-icon-144x144.png}">
    <meta name="theme-color" content="#389663">
</head>
<body class="admin-theme bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased overflow-hidden">

<div class="flex h-screen w-full overflow-hidden">
    <aside th:replace="~{fragments/admin/sidebar :: sidebar}"></aside>
    <main class="admin-shell-main admin-scrollbar flex-1 h-full overflow-y-auto relative bg-background-light dark:bg-background-dark">
        <div class="min-h-full p-4 md:p-6">
            <div class="mx-auto w-full max-w-[1600px]" layout:fragment="content"></div>
        </div>
    </main>
</div>
<th:block layout:fragment="scripts"></th:block>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const currentPath = window.location.pathname;
        document.querySelectorAll('[data-admin-nav]').forEach((link) => {
            const navPath = link.getAttribute('data-admin-nav');
            const isActive = navPath === '/admin/dashboard'
                ? currentPath === '/admin/dashboard'
                : currentPath.startsWith(navPath);
            if (isActive) {
                link.classList.add('is-active');
            }
        });
    });
</script>
</body>
</html>

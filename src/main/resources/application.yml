server:
  port: ${SERVER_PORT:8080}
app:
  base-url: ${APP_BASE_URL:http://localhost:${SERVER_PORT:8080}}
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  token:
    expiry-minutes: 10

upload:
  path: uploads/thumbnails/

spring:
  application:
    name: DonationManagement
  security:
    user:
      name: admin
      password: "{noop}123456"
  datasource:
    url:
      ${MYSQL_URL:jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/donation?useSSL=false&serverTimezone=${app.timezone}&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: ${app.timezone}

  jackson:
    time-zone: ${app.timezone}

  thymeleaf:
    cache: false
  devtools:
    livereload:
      enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

#PayOS
payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}
  return-url: ${app.base-url}/thanh-toan/thanh-cong
  cancel-url: ${app.base-url}/thanh-toan/that-bai
